<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mkt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#191728" />
    </linearGradient>
    <linearGradient id="meta-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0064e0" />
      <stop offset="100%" stop-color="#00a8ff" />
    </linearGradient>
    <linearGradient id="google-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea4335" />
      <stop offset="50%" stop-color="#fbbc05" />
      <stop offset="100%" stop-color="#34a853" />
    </linearGradient>
    <linearGradient id="glow-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bg-mkt)" />
  <rect width="798" height="498" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Top Bar -->
  <rect x="25" y="20" width="750" height="45" rx="8" fill="#13192a" />
  <circle cx="45" cy="42" r="5" fill="#ef4444" />
  <circle cx="62" cy="42" r="5" fill="#f59e0b" />
  <circle cx="79" cy="42" r="5" fill="#10b981" />
  <text x="110" y="47" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">AdScale Matrix — Performance Ads &amp; ROAS Optimization Engine</text>

  <!-- Left Column: Channel Performance -->
  <rect x="25" y="80" width="240" height="395" rx="12" fill="#121829" stroke="rgba(255,255,255,0.04)" />
  <text x="45" y="115" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">Multi-Channel Ads</text>

  <!-- Meta Ads Card -->
  <rect x="40" y="135" width="210" height="90" rx="8" fill="#1b233a" stroke="rgba(0,100,224,0.3)" />
  <rect x="52" y="150" width="24" height="24" rx="5" fill="url(#meta-grad)" />
  <text x="85" y="167" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Meta Ads Manager</text>
  <text x="52" y="195" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">ROAS: <tspan fill="#34d399" font-weight="bold">4.82x</tspan> | CTR: <tspan fill="#38bdf8">3.4%</tspan></text>
  <text x="52" y="212" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10">Ad Spend: ₹1,50,000 → ₹7,23,000</text>

  <!-- Google Ads Card -->
  <rect x="40" y="240" width="210" height="90" rx="8" fill="#1b233a" stroke="rgba(234,67,53,0.3)" />
  <rect x="52" y="255" width="24" height="24" rx="5" fill="url(#google-grad)" />
  <text x="85" y="272" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Google Search Ads</text>
  <text x="52" y="300" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">ROAS: <tspan fill="#34d399" font-weight="bold">5.15x</tspan> | CPC: <tspan fill="#f59e0b">₹12.40</tspan></text>
  <text x="52" y="317" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10">High-intent search conversions</text>

  <!-- Conversion Rate Funnel Card -->
  <rect x="40" y="345" width="210" height="115" rx="8" fill="#1b233a" stroke="rgba(249,115,22,0.3)" />
  <text x="52" y="370" fill="#fb923c" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Conversion Rate</text>
  <text x="52" y="405" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800">4.92%</text>
  <text x="52" y="435" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">▲ Industry Avg: 1.8%</text>

  <!-- Right Big Showcase Area -->
  <rect x="280" y="80" width="495" height="190" rx="12" fill="#121829" stroke="rgba(255,255,255,0.04)" />
  <text x="305" y="115" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">Cumulative Digital Revenue Growth</text>
  
  <path d="M 305 230 Q 380 210, 440 170 T 580 160 T 740 110" fill="none" stroke="url(#glow-orange)" stroke-width="4" />
  <path d="M 305 230 Q 380 210, 440 170 T 580 160 T 740 110 L 740 250 L 305 250 Z" fill="url(#glow-orange)" opacity="0.1" />
  <circle cx="740" cy="110" r="6" fill="#f97316" stroke="#ffffff" stroke-width="2" />

  <!-- Bottom Metric Pods -->
  <rect x="280" y="285" width="155" height="190" rx="12" fill="#121829" stroke="rgba(255,255,255,0.04)" />
  <text x="295" y="315" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">IMPRESSIONS</text>
  <text x="295" y="355" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800">3.4M+</text>
  <text x="295" y="385" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="11">Targeted Reach</text>

  <rect x="450" y="285" width="155" height="190" rx="12" fill="#121829" stroke="rgba(255,255,255,0.04)" />
  <text x="465" y="315" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">QUALIFIED LEADS</text>
  <text x="465" y="355" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800">1,820</text>
  <text x="465" y="385" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="11">Cost/Lead: ₹82</text>

  <rect x="620" y="285" width="155" height="190" rx="12" fill="#121829" stroke="rgba(255,255,255,0.04)" />
  <text x="635" y="315" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">TOTAL REVENUE</text>
  <text x="635" y="355" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800">₹18.6L</text>
  <text x="635" y="385" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="11">Generated via Ads</text>
</svg>
