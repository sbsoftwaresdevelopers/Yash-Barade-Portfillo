<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-crm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purple-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bg-crm)" />
  <rect width="798" height="498" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Window Header -->
  <rect x="25" y="20" width="750" height="45" rx="8" fill="#131b2e" />
  <circle cx="45" cy="42" r="5" fill="#ef4444" />
  <circle cx="62" cy="42" r="5" fill="#f59e0b" />
  <circle cx="79" cy="42" r="5" fill="#10b981" />
  <text x="110" y="46" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">SB Enterprise Core — Cloud CRM &amp; Workflow ERP</text>

  <!-- Left Sidebar -->
  <rect x="25" y="80" width="160" height="395" rx="10" fill="#111827" stroke="rgba(255,255,255,0.03)" />
  <text x="45" y="115" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">⚡ SB SYSTEM</text>
  <rect x="40" y="140" width="130" height="32" rx="6" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.3)" />
  <text x="55" y="161" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Operations Hub</text>
  <text x="55" y="205" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Client Pipelines</text>
  <text x="55" y="245" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Automated Billing</text>
  <text x="55" y="285" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">API Gateways</text>
  <text x="55" y="325" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">System Logs</text>

  <!-- Metric Card 1 -->
  <rect x="205" y="80" width="175" height="100" rx="10" fill="#161f33" stroke="rgba(255,255,255,0.05)" />
  <text x="225" y="110" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">ACTIVE CLIENT PIPES</text>
  <text x="225" y="145" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800">1,248</text>
  <text x="225" y="168" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">▲ 99.98% Uptime</text>

  <!-- Metric Card 2 -->
  <rect x="395" y="80" width="175" height="100" rx="10" fill="#161f33" stroke="rgba(255,255,255,0.05)" />
  <text x="415" y="110" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">PROCESSED TASKS</text>
  <text x="415" y="145" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800">89,430</text>
  <text x="415" y="168" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">⚡ 18ms Latency</text>

  <!-- Metric Card 3 -->
  <rect x="585" y="80" width="190" height="100" rx="10" fill="#161f33" stroke="rgba(255,255,255,0.05)" />
  <text x="605" y="110" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">SERVER STATUS</text>
  <text x="605" y="145" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800">OPTIMAL</text>
  <text x="605" y="168" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Docker Clustered</text>

  <!-- Main Chart & Workflow Visualization -->
  <rect x="205" y="200" width="570" height="275" rx="10" fill="#161f33" stroke="rgba(255,255,255,0.05)" />
  <text x="230" y="235" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">Real-Time Data Pipeline &amp; Queue Ingestion</text>

  <!-- Bar Graphs -->
  <rect x="240" y="380" width="30" height="60" rx="4" fill="url(#cyan-accent)" opacity="0.8" />
  <rect x="290" y="340" width="30" height="100" rx="4" fill="url(#cyan-accent)" opacity="0.8" />
  <rect x="340" y="310" width="30" height="130" rx="4" fill="url(#cyan-accent)" />
  <rect x="390" y="280" width="30" height="160" rx="4" fill="url(#cyan-accent)" />
  <rect x="440" y="330" width="30" height="110" rx="4" fill="url(#cyan-accent)" opacity="0.8" />
  <rect x="490" y="295" width="30" height="145" rx="4" fill="url(#cyan-accent)" />
  <rect x="540" y="260" width="30" height="180" rx="4" fill="url(#purple-accent)" />
  <rect x="590" y="275" width="30" height="165" rx="4" fill="url(#cyan-accent)" />
  <rect x="640" y="320" width="30" height="120" rx="4" fill="url(#cyan-accent)" opacity="0.8" />
  <rect x="690" y="250" width="30" height="190" rx="4" fill="url(#purple-accent)" />

  <line x1="230" y1="445" x2="745" y2="445" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
